<script>
        // ★重要★ ここのURLは、お手元の最新の「ウェブアプリのURL」に書き換えてください
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxVU6IoeX9_D_kKxDiSqU_1Y3IqIaM170xQHBLEzCb_N3syxSqFNNmRKzkhusKVCU3Q/exec";
        
        const STORAGE_KEY = "survey_offline_queue";
        let currentPatientId = "";
        let isSubmitting = false;

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        document.addEventListener("DOMContentLoaded", () => {
            updateNetworkStatus();
            setInterval(syncQueue, 30000);

            const idInput = document.getElementById("patient-id");
            idInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    startSurvey();
                }
            });
        });

        function updateNetworkStatus() {
            const dot = document.getElementById("status-dot");
            const text = document.getElementById("status-text");
            const queue = getQueue();

            if (navigator.onLine) {
                dot.className = "status-dot online";
                text.innerHTML = `オンライン（未送信データ: <span id="queue-count">${queue.length}</span>件）`;
                if (queue.length > 0) syncQueue();
            } else {
                dot.className = "status-dot offline";
                text.innerHTML = `オフライン（未送信データ: <span id="queue-count">${queue.length}</span>件）`;
            }
        }

        function getQueue() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveQueue(queue) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(queue));
            updateNetworkStatus();
        }

        function startSurvey() {
            const idInput = document.getElementById("patient-id").value.trim();
            if (!idInput) {
                alert("患者IDが入力されていません。");
                return;
            }
            currentPatientId = idInput;
            document.getElementById("step-id").classList.add("hidden");
            document.getElementById("step-survey").classList.remove("hidden");
        }

        function resetSurveyForm() {
            document.querySelector('input[name="q1"][value="3"]').checked = true;
            document.querySelector('input[name="q2"][value="3"]').checked = true;
        }

        function goBack() {
            resetSurveyForm();
            const idInputField = document.getElementById("patient-id");
            idInputField.value = "";
            currentPatientId = "";
            
            document.getElementById("step-survey").classList.add("hidden");
            document.getElementById("step-id").classList.remove("hidden");
            setTimeout(() => idInputField.focus(), 100);
        }

        async function submitSurvey() {
            const submitBtn = document.getElementById("submit-btn");
            if (isSubmitting || submitBtn.disabled) return;

            isSubmitting = true;
            submitBtn.disabled = true;
            submitBtn.innerText = "送信中...";

            const q1 = document.querySelector('input[name="q1"]:checked').value;
            const q2 = document.querySelector('input[name="q2"]:checked').value;
            const payload = { id: currentPatientId, time: new Date().toISOString(), q1: q1, q2: q2 };

            // まず画面を完了に切り替える
            const idInputField = document.getElementById("patient-id");
            idInputField.value = "";
            document.getElementById("step-survey").classList.add("hidden");
            document.getElementById("step-complete").classList.remove("hidden");

            setTimeout(() => {
                document.getElementById("step-complete").classList.add("hidden");
                document.getElementById("step-id").classList.remove("hidden");
                resetSurveyForm();
                submitBtn.disabled = false;
                submitBtn.innerText = "回答を送信する";
                isSubmitting = false;
                setTimeout(() => idInputField.focus(), 100); 
            }, 2000);

            if (navigator.onLine) {
                try {
                    // 修正点：text/plain にして CORSブロックを回避
                    const response = await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain" },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) {
                        throw new Error(`サーバーエラー (ステータス: ${response.status})`);
                    }
                } catch (error) {
                    // 修正点：エラー内容を画面に出す
                    alert("送信に失敗しました。キューに保存します。\n原因: " + error.message);
                    let queue = getQueue();
                    queue.push(payload);
                    saveQueue(queue);
                }
            } else {
                let queue = getQueue();
                queue.push(payload);
                saveQueue(queue);
            }
        }

        async function syncQueue() {
            let queue = getQueue();
            if (queue.length === 0 || !navigator.onLine) return;

            let remaining = [...queue];

            for (let i = 0; i < queue.length; i++) {
                try {
                    const response = await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain" },
                        body: JSON.stringify(queue[i])
                    });
                    if (!response.ok) throw new Error("同期通信エラー");
                    
                    remaining.shift();
                } catch (error) {
                    console.log("同期失敗:", error);
                    break;
                }
            }
            saveQueue(remaining);
        }
    </script>
